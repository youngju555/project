# -*- coding: utf-8 -*-
"""
MyCobot 320 M5 (pymycobot)
개선 버전 v5.3 — USB 카메라 & 안전 동작 보완
----------------------------------------------------
- USB 카메라 자동 인식 (기본: /dev/video1)
- 물체 인식 실패 시 로봇 대기 (움직이지 않음)
- dry-run 모드로 카메라 테스트 가능
"""

import threading
import cv2
import time
import argparse
import numpy as np

try:
    from pymycobot.mycobot320 import MyCobot320 as CobotClass
except Exception:
    from pymycobot.mycobot import MyCobot as CobotClass


# ===============================================================
# 1️⃣ 전역 변수 및 Lock
# ===============================================================
picking_done = False
g_target_coordinate = None
g_coord_lock = threading.Lock()


# ===============================================================
# 2️⃣ 기본 설정값
# ===============================================================
POSES = {
    "Home":  [59.8, -215.9, 354.6, -175.33, 8.65, 86.68],
    "Clear_Air_A": [264.0, -1.0, 379.0, -153, 11, -106],
    "Place_B": [333.0, 11.0, 170.0, -175, -0.08, -89.0],
}
DEFAULT_SPEED = 20

# 🎯 카메라 내부 파라미터 (캘리브레이션 결과 반영)
CAMERA_MATRIX = np.array([
    [539.13729067, 0.0, 329.02126026],
    [0.0, 542.34217387, 242.10995541],
    [0.0, 0.0, 1.0]
])
DIST_COEFFS = np.array([[0.20528603, -0.76664068, -0.00096614, 0.00111892, 0.97630004]])

# ===============================================================
# 3️⃣ 픽셀 → 로봇 좌표 변환
# ===============================================================
def pixel_to_robot(cx, cy, distance_cm, frame_w, frame_h):
    pts = np.array([[[cx, cy]]], dtype=np.float32)
    undistorted_pts = cv2.undistortPoints(pts, CAMERA_MATRIX, DIST_COEFFS, P=None)
    norm_x, norm_y = undistorted_pts[0, 0]

    scale_z = distance_cm * 10.0  # cm → mm
    x_cam = norm_x * scale_z
    y_cam = norm_y * scale_z

    # === TCP 기준 (탐색 자세) ===
    TCP_BASE_OFFSET_X = 59.8
    TCP_BASE_OFFSET_Y = -215.9
    TCP_BASE_OFFSET_Z = 354.6

    # === 카메라 ↔ TCP 옵셋 (실측 필요) ===
    CAMERA_TO_TCP_OFFSET_X = 100.0  # [mm] (예: 카메라가 TCP보다 앞쪽)
    CAMERA_TO_TCP_OFFSET_Y = 0.0    # [mm]

    # === 좌표 변환 ===
    robot_x = TCP_BASE_OFFSET_X + CAMERA_TO_TCP_OFFSET_X + y_cam
    robot_y = TCP_BASE_OFFSET_Y + CAMERA_TO_TCP_OFFSET_Y + x_cam
    robot_z = TCP_BASE_OFFSET_Z - scale_z

    return {"x": round(robot_x, 2), "y": round(robot_y, 2), "z": round(robot_z, 2)}


# ===============================================================
# 4️⃣ 색상 검출 + 거리 계산
# ===============================================================
def detect_color_and_distance(frame, target_color="blue"):
    h, w, _ = frame.shape
    hsv = cv2.cvtColor(frame, cv2.COLOR_BGR2HSV)
    center_x, center_y = w // 2, h // 2

    # HSV 범위
    color_ranges = {
        "blue": [(90, 50, 50), (140, 255, 255)],  # 확장된 블루 범위
    }

    lower, upper = color_ranges.get(target_color, ((0, 0, 0), (0, 0, 0)))
    mask = cv2.inRange(hsv, np.array(lower), np.array(upper))
    mask = cv2.morphologyEx(mask, cv2.MORPH_OPEN, np.ones((5, 5), np.uint8))
    contours, _ = cv2.findContours(mask, cv2.RETR_EXTERNAL, cv2.CHAIN_APPROX_SIMPLE)

    detected_info = []
    KNOWN_WIDTH = 2.5
    fx = CAMERA_MATRIX[0, 0]

    USE_FIXED_DISTANCE = True
    FIXED_DISTANCE_CM = 30.0  # 탐색 자세에서 카메라~물체 거리(cm)

    if contours:
        c = max(contours, key=cv2.contourArea)
        if cv2.contourArea(c) > 300:
            x, y, w_box, h_box = cv2.boundingRect(c)
            cx, cy = x + w_box // 2, y + h_box // 2

            distance = FIXED_DISTANCE_CM if USE_FIXED_DISTANCE else (KNOWN_WIDTH * fx) / w_box
            offset_x = cx - center_x
            offset_y = cy - center_y
            detected_info.append((target_color, (cx, cy), distance, offset_x, offset_y))

            # 시각화
            cv2.rectangle(frame, (x, y), (x + w_box, y + h_box), (255, 255, 0), 2)
            cv2.drawMarker(frame, (cx, cy), (0, 0, 255), cv2.MARKER_CROSS, 15, 2)
            cv2.putText(frame, f"{target_color} {distance:.1f}cm", (x, y - 10),
                        cv2.FONT_HERSHEY_SIMPLEX, 0.6, (0, 255, 255), 2)

    return frame, detected_info


# ===============================================================
# 5️⃣ 카메라 스레드
# ===============================================================
def camera_capture_thread(stop_event, frame_container, target_color="blue", mc=None):
    global picking_done, g_target_coordinate, g_coord_lock

    print("📷 카메라 연결 시도 중...")

    # 기본 USB 카메라 포트: /dev/video1
    cap = cv2.VideoCapture(1)
    if not cap.isOpened():
        print("⚠️ /dev/video1 열기 실패 → 기본 포트 0 시도")
        cap = cv2.VideoCapture(0)

    if not cap.isOpened():
        print("❌ 카메라를 열 수 없습니다. 연결 확인 필요!")
        return

    print("✅ 카메라 스레드 시작")
    time.sleep(2.0)

    while not stop_event.is_set():
        ret, frame = cap.read()
        if not ret or frame is None:
            print("⚠️ 프레임 읽기 실패... 카메라 연결을 확인하세요.")
            time.sleep(0.2)
            continue

        processed_frame, detected = detect_color_and_distance(frame, target_color)
        frame_container["frame"] = processed_frame

        # 인식 성공한 경우만 좌표 전송
        if detected and not picking_done and mc is not None:
            color_name, (cx, cy), dist, _, _ = detected[0]
            print(f"🎯 감지: {color_name} ({cx},{cy}), 거리 {dist:.1f}cm")

            h, w, _ = frame.shape
            coord = pixel_to_robot(cx, cy, dist, w, h)
            with g_coord_lock:
                g_target_coordinate = coord
            picking_done = True
            print(f"✅ 좌표 전송 완료: {coord}")
        else:
            # 인식 실패 시 상태 표시
            cv2.putText(frame, "Waiting for object...", (15, 30),
                        cv2.FONT_HERSHEY_SIMPLEX, 0.8, (0, 0, 255), 2)

        time.sleep(0.05)  # 20fps 정도로 제한

    cap.release()
    print("📷 카메라 스레드 종료")


# ===============================================================
# 6️⃣ 메인 제어 루프
# ===============================================================
def main():
    global g_target_coordinate, g_coord_lock, picking_done

    parser = argparse.ArgumentParser()
    parser.add_argument("--port", type=str, default="/dev/ttyACM0")
    parser.add_argument("--baud", type=int, default=115200)
    parser.add_argument("--speed", type=int, default=20)
    parser.add_argument("--color", type=str, default="blue")
    parser.add_argument("--camera", type=int, default=1, help="USB 카메라 포트 번호 (기본: 1)")
    parser.add_argument("--dry-run", action="store_true", help="로봇 없이 카메라 테스트만 실행")
    args = parser.parse_args()

    GRIPPER_OFFSET_Z = 18.0
    APPROACH_HEIGHT = 35.0
    PICK_RX, PICK_RY, PICK_RZ = -175.33, 8.65, 86.68

    frame_container = {"frame": None}
    stop_event = threading.Event()
    mc = None

    if not args.dry_run:
        mc = CobotClass(args.port, args.baud)
        time.sleep(0.5)
        mc.power_on()
        print("🔌 Power ON 완료")

        mc.set_gripper_state(0, 80)
        time.sleep(1)
        mc.send_coords(POSES["Home"], args.speed)
        time.sleep(3)
        print("✅ 홈 위치 도달 완료")

    cam_thread = threading.Thread(target=camera_capture_thread,
                                  args=(stop_event, frame_container, args.color, mc),
                                  daemon=True)
    cam_thread.start()

    print("✅ 메인 루프 시작 (q로 종료)")

    try:
        while not stop_event.is_set():
            frame = frame_container.get("frame")
            if frame is not None:
                cv2.imshow("Camera View", frame)

            if cv2.waitKey(1) & 0xFF == ord('q'):
                stop_event.set()
                break

            current_coord = None
            with g_coord_lock:
                if g_target_coordinate is not None:
                    current_coord = g_target_coordinate.copy()
                    g_target_coordinate = None

            if current_coord and mc is not None and picking_done:
                print(f"🤖 인식 성공 → 로봇 이동 시작: {current_coord}")
                pick_x = current_coord["x"]
                pick_y = current_coord["y"]
                z_surface = current_coord["z"]
                z_approach = z_surface + APPROACH_HEIGHT
                z_grasp = z_surface - GRIPPER_OFFSET_Z

                mc.set_gripper_state(0, 80)
                time.sleep(1)
                mc.send_coords([pick_x, pick_y, z_approach, PICK_RX, PICK_RY, PICK_RZ], 30, 1)
                time.sleep(2)
                mc.send_coords([pick_x, pick_y, z_grasp, PICK_RX, PICK_RY, PICK_RZ], 20, 1)
                time.sleep(1.5)
                mc.set_gripper_state(1, 80)
                time.sleep(1.5)
                mc.send_coords([pick_x, pick_y, z_approach, PICK_RX, PICK_RY, PICK_RZ], 20, 1)
                time.sleep(2)

                mc.send_coords(POSES["Clear_Air_A"], args.speed, 1)
                time.sleep(3)
                mc.send_coords(POSES["Place_B"], args.speed, 1)
                time.sleep(3)
                mc.set_gripper_state(0, 80)
                time.sleep(1.5)
                mc.send_coords(POSES["Home"], args.speed)
                time.sleep(3)
                print("✅ 1회 피킹 완료")

                picking_done = False  # 다음 탐색을 위해 초기화

            elif mc is not None and not picking_done:
                # 물체 미검출 시 대기
                pass

    finally:
        stop_event.set()
        cam_thread.join()
        cv2.destroyAllWindows()
        print("🔒 종료")


if __name__ == "__main__":
    main()
